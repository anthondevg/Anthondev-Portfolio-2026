<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Anthony Gonzalez — LinkedIn banner</title>
  <desc id="desc">A minimal dark editorial banner with large typography, violet atmospheric light and a decorative geometric mesh on the far right.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#110623"/>
      <stop offset=".42" stop-color="#09080f"/>
      <stop offset="1" stop-color="#11101b"/>
    </linearGradient>
    <radialGradient id="violet-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1036 210) rotate(167) scale(760 360)">
      <stop stop-color="#7047ff" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#361687" stop-opacity=".2"/>
      <stop offset="1" stop-color="#08070d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1432 187) rotate(90) scale(235 365)">
      <stop stop-color="#7047ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7047ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mesh-stroke" x1="1170" y1="360" x2="1584" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7047ff" stop-opacity=".03"/>
      <stop offset=".38" stop-color="#a88cff" stop-opacity=".21"/>
      <stop offset=".76" stop-color="#f0ecf5" stop-opacity=".13"/>
      <stop offset="1" stop-color="#7047ff" stop-opacity=".02"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".83" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .09"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="right-edge">
      <rect x="1120" width="464" height="396"/>
    </clipPath>
  </defs>

  <rect width="1584" height="396" fill="url(#base)"/>
  <rect width="1584" height="396" fill="url(#violet-light)"/>
  <rect x="1080" width="504" height="396" fill="url(#mesh-light)"/>

  <!-- Quiet scaffold: enough structure to match the portfolio without adding clutter. -->
  <path d="M32 42H1552M32 354H1552" fill="none" stroke="#f0ecf5" stroke-opacity=".1"/>
  <path d="M374 42V354" fill="none" stroke="#a88cff" stroke-opacity=".14"/>

  <!-- LinkedIn portrait-safe area. -->
  <circle cx="162" cy="208" r="132" fill="none" stroke="#a88cff" stroke-opacity=".04"/>
  <circle cx="162" cy="208" r="84" fill="none" stroke="#a88cff" stroke-opacity=".035" stroke-dasharray="2 9"/>

  <!-- Large, intentionally sparse positioning statement. -->
  <g font-family="Arial, sans-serif">
    <text x="424" y="88" font-size="17" font-weight="700" letter-spacing="3.4" fill="#d3ccd9">ANTHONY GONZALEZ</text>
    <text x="418" y="184" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="400" letter-spacing="-4" fill="#f0ecf5">Full-Stack Engineer</text>
    <text x="418" y="270" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="400" letter-spacing="-4.2" fill="#aa8dff">building AI products</text>
    <text x="424" y="319" font-size="14" font-weight="700" letter-spacing="2.5" fill="#bbb3c5">AI SYSTEMS  ·  PRODUCT ENGINEERING</text>
  </g>

  <!-- Decorative bent geometric mesh, isolated at the far-right edge. -->
  <g clip-path="url(#right-edge)" fill="none" stroke="url(#mesh-stroke)" stroke-width="1">
    <path d="M1118 368C1185 289 1209 163 1252 18"/>
    <path d="M1162 380C1225 292 1246 160 1287 4"/>
    <path d="M1211 391C1269 291 1284 151 1324-6"/>
    <path d="M1265 403C1314 290 1327 146 1366-14"/>
    <path d="M1324 414C1363 287 1374 139 1413-22"/>
    <path d="M1388 421C1417 284 1427 132 1469-25"/>
    <path d="M1457 425C1474 276 1487 123 1533-21"/>
    <path d="M1530 424C1537 265 1551 114 1600-10"/>

    <path d="M1102 329C1211 280 1320 344 1607 244"/>
    <path d="M1114 290C1223 242 1335 303 1607 211"/>
    <path d="M1128 249C1237 204 1350 260 1604 176"/>
    <path d="M1144 207C1254 167 1367 214 1599 141"/>
    <path d="M1161 164C1273 131 1385 166 1592 106"/>
    <path d="M1180 122C1294 98 1404 116 1584 72"/>
    <path d="M1201 81C1315 67 1426 67 1574 39"/>
    <path d="M1225 43C1339 36 1448 26 1561 8"/>
  </g>

  <g clip-path="url(#right-edge)" opacity=".6">
    <circle cx="1450" cy="139" r="3" fill="#a88cff"/>
    <circle cx="1450" cy="139" r="12" fill="none" stroke="#a88cff" stroke-opacity=".2"/>
    <path d="M1450 139h74" stroke="#a88cff" stroke-opacity=".22"/>
  </g>

  <rect width="1584" height="396" filter="url(#grain)" opacity=".19" style="mix-blend-mode:soft-light"/>
  <rect x=".5" y=".5" width="1583" height="395" fill="none" stroke="#f0ecf5" stroke-opacity=".05"/>
</svg>
